# The presentation setup selects a float divisor at 0x82F79FBC. The update
# path divides its per-frame progress by that value before each resolver call.
# The probes are read-only. The final default-off hook applies only the native
# 0.5 test value after an observed-normal 2.0 setup selection.

[[midasm_hook]]
address = 0x82D66F08
name = "ReRevvedProbeCombatPaceSelected"

[[midasm_hook]]
address = 0x82D6ADF8
name = "ReRevvedProbeCombatPaceStepBegin"
registers = ["r31"]

[[midasm_hook]]
address = 0x82D6AE3C
name = "ReRevvedProbeCombatPaceStepEnd"
registers = ["r11"]

[[midasm_hook]]
address = 0x82D7F930
name = "ReRevvedProbeCombatObjectScaleSet"

[[midasm_hook]]
address = 0x82D7F934
name = "ReRevvedApplyCombatPaceOverride"

# The shared civilization-bonus lookup reads one immutable four-era row for the
# current player's civilization. This entry probe records bounded query inputs
# and independently reads the selected row without changing guest state.

[[midasm_hook]]
address = 0x82CF0CB0
name = "ReRevvedProbeCivilizationBonusLookup"
registers = ["r3", "r4", "r5"]

# The unit branch of the central rush-cost routine computes the displayed and
# submitted cost at 0x82CE2934. The Rush command consumer later converts that
# submitted gold amount back into production before storing both production and
# treasury. These default-off hooks are read-only and bracket both values.

[[midasm_hook]]
address = 0x82CE2938
name = "ReRevvedProbeRushCostDisplay"
registers = ["r27", "r29", "r30", "r31", "r6", "r7", "r11"]

[[midasm_hook]]
address = 0x82D17A9C
name = "ReRevvedProbeRushCostApply"
registers = ["r24", "r25", "r26", "r28", "r30", "r31", "r3", "r6", "r8", "r11"]

# Ring-buffer initialization brackets the guest reset. Pause the host GPU while
# the guest resets the ring, then resume it before the next instruction.

[[midasm_hook]]
address = 0x8269CAE0
name = "ReRevvedCompatRingInitializeBegin"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x8269CAE4
name = "ReRevvedCompatRingInitializeEnd"

# Retain a failed render config until the same renderer supplies valid caps.

[[midasm_hook]]
address = 0x82245050
name = "ReRevvedRememberGfxRenderConfig"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x82302E90
name = "ReRevvedHandleGfxRenderCapsBegin"
registers = ["r3", "r4", "lr"]

[[midasm_hook]]
address = 0x82302F0C
name = "ReRevvedHandleGfxRenderCapsEnd"
registers = ["r3", "r31"]

# GFx's 512-entry vector cache can reject a live glyph until the next redraw.

[[midasm_hook]]
address = 0x82253D2C
name = "ReRevvedCompatExpandGfxVectorGlyphCache"
registers = ["r31"]
